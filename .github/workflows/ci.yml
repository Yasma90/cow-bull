name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Use normal restore until package lock files are generated and committed.
      - name: Restore
        run: dotnet restore CowBull.Modern.sln

      - name: Build
        run: dotnet build CowBull.Modern.sln --configuration Release --no-restore --warnaserror

      - name: Verify formatting
        run: dotnet format CowBull.Modern.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Test with coverage
        run: dotnet test CowBull.Modern.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults --logger trx

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14
